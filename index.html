<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Lab 101</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: #e6e6e6; }
    #app { width: 100vw; height: 100vh; display: block; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; pointer-events: none; z-index: 10; display: none; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.85); }
    #crosshair::before { left: 9px; top: 2px; width: 2px; height: 16px; }
    #crosshair::after { top: 9px; left: 2px; height: 2px; width: 16px; }
    #hud { position: fixed; left: 20px; bottom: 20px; z-index: 10; font-size: 14px; line-height: 1.6; text-shadow: 0 0 4px #000; pointer-events: none; display: none; }
    #hud .slot { display: inline-block; padding: 4px 10px; margin-right: 4px; border: 1px solid #555; border-radius: 4px; background: rgba(0,0,0,0.4); }
    #hud .slot.active { border-color: #7cf; color: #7cf; background: rgba(0,80,120,0.4); }
    #msg { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); color: #7cf; z-index: 10; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
    #menu { position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, #1b2838, #05080d); z-index: 100; display: flex; padding: 40px; gap: 30px; }
    #menu.hidden { display: none !important; }
    #menu h1 { font-size: 42px; letter-spacing: 4px; color: #7cf; margin-bottom: 6px; }
    #menu .sub { color: #889; margin-bottom: 20px; font-size: 13px; letter-spacing: 2px; }
    #menu .col { flex: 1; overflow-y: auto; }
    #menu .col h2 { font-size: 14px; letter-spacing: 2px; color: #aaa; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 6px; }
    .slotRow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: #0e1620; border: 1px solid #223; border-radius: 4px; margin-bottom: 6px; }
    .slotRow.locked { opacity: 0.55; }
    .slotRow .num { width: 24px; text-align: center; color: #7cf; font-weight: bold; }
    .slotRow select { flex: 1; background: #0a1018; color: #eee; border: 1px solid #345; padding: 4px; border-radius: 3px; }
    .weaponCard { background: #0e1620; border: 1px solid #223; border-radius: 4px; padding: 10px; margin-bottom: 8px; }
    .weaponCard .name { color: #7cf; font-weight: bold; margin-bottom: 4px; }
    .weaponCard .stats { font-size: 12px; color: #889; }
    #startBtn { margin-top: 20px; width: 100%; padding: 14px; background: #1c6; border: none; color: #000; font-weight: bold; letter-spacing: 3px; cursor: pointer; border-radius: 4px; font-size: 16px; }
    #startBtn:hover { background: #2e8; }
    #pause { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
    #pause.show { display: flex; }
    #pause h2 { font-size: 32px; letter-spacing: 4px; color: #7cf; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="crosshair"></div>
  <div id="hud"></div>
  <div id="msg"></div>
  
  <div id="menu">
    <div class="col">
      <h1>LAB 101</h1>
      <div class="sub">RAGDOLL PHYSICS RESEARCH FACILITY</div>
      <h2>LOADOUT — ASSIGN WEAPONS TO SLOTS 1-8</h2>
      <div id="slotList"></div>
    </div>
    <div class="col">
      <h2>WEAPON LIBRARY</h2>
      <div id="weaponList"></div>
      <button id="startBtn">ENTER THE LAB</button>
    </div>
  </div>
  
  <div id="pause"><h2>PAUSED</h2><div style="color:#888">Click to resume</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
